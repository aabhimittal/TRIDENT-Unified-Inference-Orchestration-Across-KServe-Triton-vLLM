[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trident-router"
version = "0.2.0"
description = "TRIDENT: unified, SLO-aware inference orchestration across KServe, NVIDIA Triton, and vLLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abhi Mittal" }]
keywords = ["inference", "kserve", "triton", "vllm", "routing", "slo", "kubernetes"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
trident = "trident.__main__:main"

[tool.setuptools.packages.find]
include = ["trident*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule selection explicitly so lint results don't drift with ruff's
# release-to-release default changes (CI installs the latest ruff).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "RUF"]

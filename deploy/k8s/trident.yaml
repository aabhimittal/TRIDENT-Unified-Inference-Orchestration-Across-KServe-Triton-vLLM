# TRIDENT router deployment: the single front door for all inference traffic.
apiVersion: v1
kind: Namespace
metadata:
  name: serving
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trident-config
  namespace: serving
data:
  # Mount your real config here; see config/trident.example.yaml for the schema.
  trident.yaml: |
    slo_classes:
      interactive: { target_p95_ms: 1500, priority: 10 }
      batch:       { target_p95_ms: 30000, priority: 1 }
    backends:
      - name: vllm-llama
        kind: vllm
        base_url: http://vllm-llama.serving.svc.cluster.local:8000
        metrics_url: http://vllm-llama.serving.svc.cluster.local:8000/metrics
        max_concurrency: 64
        models:
          - name: llama-3-8b
            upstream_name: meta-llama/Meta-Llama-3-8B-Instruct
            workloads: [llm_chat, llm_completion]
      - name: triton-cv
        kind: triton
        base_url: http://triton-cv.serving.svc.cluster.local:8000
        metrics_url: http://triton-cv.serving.svc.cluster.local:8002/metrics
        max_concurrency: 48
        models:
          - name: resnet50
            workloads: [tensor]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trident
  namespace: serving
  labels: { app: trident }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trident }
  template:
    metadata:
      labels: { app: trident }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: trident
          image: ghcr.io/aabhimittal/trident:0.1.0
          args: ["--config", "/etc/trident/trident.yaml", "--port", "8080"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/trident
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: trident-config }
---
apiVersion: v1
kind: Service
metadata:
  name: trident
  namespace: serving
spec:
  selector: { app: trident }
  ports:
    - name: http
      port: 80
      targetPort: 8080
